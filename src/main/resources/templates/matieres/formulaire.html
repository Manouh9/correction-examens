<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${matiere.idMatiere == null} ? 'Nouvelle matière' : 'Modifier matière'">Formulaire matière</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-pencil-square"></i> Correction Examens
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${matiere.idMatiere == null} ? 'Créer une nouvelle matière' : 'Modifier la matière'"></h4>
                    </div>
                    <div class="card-body">
                        <!-- IMPORTANT: Utilisation de @{} pour le context-path -->
                        <form th:action="${matiere.idMatiere == null} ? @{/matieres/save} : @{/matieres/update/{id}(id=${matiere.idMatiere})}" 
                              method="post">
                            
                            <!-- Champ caché pour l'ID -->
                            <input type="hidden" name="idMatiere" th:value="${matiere.idMatiere}" />
                            
                            <div class="mb-3">
                                <label for="nomMatiere" class="form-label">Nom de la matière <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nomMatiere" name="nomMatiere" 
                                       th:value="${matiere.nomMatiere}" required>
                            </div>

                            <div class="mb-3">
                                <label for="coefficient" class="form-label">Coefficient</label>
                                <input type="number" step="0.1" class="form-control" id="coefficient" name="coefficient" 
                                       th:value="${matiere.coefficient}" min="0.5" max="5">
                                <small class="text-muted">Valeur entre 0.5 et 5, par défaut : 1.0</small>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/matieres}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> 
                                    <span th:text="${matiere.idMatiere == null} ? 'Créer' : 'Modifier'"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
