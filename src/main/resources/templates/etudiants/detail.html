<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-pencil-square"></i> Correction Examens
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0"><i class="bi bi-person"></i> Détails de l'étudiant</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <th width="150"><i class="bi bi-hash"></i> ID :</th>
                                <td th:text="${etudiant.idEtudiant}"></td>
                            </tr>
                            <tr>
                                <th><i class="bi bi-person"></i> Nom :</th>
                                <td th:text="${etudiant.nom}"></td>
                            </tr>
                            <tr>
                                <th><i class="bi bi-person"></i> Prénom :</th>
                                <td th:text="${etudiant.prenom}"></td>
                            </tr>
                            <tr>
                                <th><i class="bi bi-card-text"></i> Numéro étudiant :</th>
                                <td th:text="${etudiant.numeroEtudiant}"></td>
                            </tr>
                            <tr>
                                <th><i class="bi bi-file-text"></i> Nombre d'examens :</th>
                                <td>
                                    <span class="badge bg-primary" th:text="${etudiant.examens != null ? #lists.size(etudiant.examens) : 0}"></span>
                                </td>
                            </tr>
                        </table>

                        <hr>
                        
                        <div class="d-flex justify-content-between">
                            <a href="/etudiants" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Retour à la liste
                            </a>
                            <div>
                                <a th:href="@{/etudiants/edit/{id}(id=${etudiant.idEtudiant})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/etudiants/delete/{id}(id=${etudiant.idEtudiant})}" 
                                   class="btn btn-danger"
                                   onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
