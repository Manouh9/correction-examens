<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des étudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-pencil-square"></i> Correction Examens
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/etudiants}">Étudiants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/matieres}">Matières</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/correcteurs}">Correcteurs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/examens}">Examens</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- En-tête avec bouton d'ajout -->
        <div class="row mb-3">
            <div class="col">
                <h2><i class="bi bi-people"></i> Liste des étudiants</h2>
            </div>
            <div class="col text-end">
                <a th:href="@{/etudiants/nouveau}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Nouvel étudiant
                </a>
            </div>
        </div>

        <!-- Messages de notification -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Barre de recherche -->
        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/etudiants/search}" method="get" class="row g-3">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" name="nom" 
                                   placeholder="Rechercher par nom..." th:value="${recherche}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Rechercher
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tableau des étudiants -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Numéro étudiant</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="etudiant : ${etudiants}">
                        <td th:text="${etudiant.idEtudiant}"></td>
                        <td th:text="${etudiant.nom}"></td>
                        <td th:text="${etudiant.prenom}"></td>
                        <td th:text="${etudiant.numeroEtudiant}"></td>
                        <td class="text-center">
                            <a th:href="@{/etudiants/{id}(id=${etudiant.idEtudiant})}" 
                               class="btn btn-sm btn-info" title="Voir détails">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/etudiants/edit/{id}(id=${etudiant.idEtudiant})}" 
                               class="btn btn-sm btn-warning" title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/etudiants/delete/{id}(id=${etudiant.idEtudiant})}" 
                               class="btn btn-sm btn-danger" 
                               title="Supprimer"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant ?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(etudiants)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-emoji-frown fs-1 d-block"></i>
                            Aucun étudiant trouvé
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
