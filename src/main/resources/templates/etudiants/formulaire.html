<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${etudiant.idEtudiant == null} ? 'Nouvel étudiant' : 'Modifier étudiant'">Formulaire étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-pencil-square"></i> Correction Examens
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${etudiant.idEtudiant == null} ? 'Créer un nouvel étudiant' : 'Modifier l\'étudiant'">
                            Formulaire étudiant
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- IMPORTANT: Utilisation de @{} pour que Thymeleaf ajoute le context-path -->
                        <form th:action="@{/etudiants/save}" method="post">
                            
                            <!-- Champ caché pour l'ID -->
                            <input type="hidden" name="idEtudiant" th:value="${etudiant.idEtudiant}" />

                            <div class="mb-3">
                                <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nom" name="nom" 
                                       th:value="${etudiant.nom}" required>
                            </div>

                            <div class="mb-3">
                                <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="prenom" name="prenom" 
                                       th:value="${etudiant.prenom}" required>
                            </div>

                            <div class="mb-3">
                                <label for="numeroEtudiant" class="form-label">Numéro étudiant <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="numeroEtudiant" name="numeroEtudiant" 
                                       th:value="${etudiant.numeroEtudiant}" 
                                       th:attr="readonly=${etudiant.idEtudiant != null} ? 'readonly' : null"
                                       required>
                                <small class="text-muted" th:if="${etudiant.idEtudiant != null}">
                                    <i class="bi bi-info-circle"></i> Le numéro étudiant ne peut pas être modifié
                                </small>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/etudiants}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> 
                                    <span th:text="${etudiant.idEtudiant == null} ? 'Créer' : 'Modifier'"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
