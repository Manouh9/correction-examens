<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des examens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Correction Examens</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/etudiants">Étudiants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/correcteurs">Correcteurs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/examens">Examens</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parametres">Paramètres</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Liste des examens</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Étudiant</th>
                    <th>Matière</th>
                    <th>Date</th>
                    <th>Nombre de corrections</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="examen : ${examens}">
                    <td th:text="${examen.idExamen}"></td>
                    <td th:text="${examen.etudiant.nom + ' ' + examen.etudiant.prenom}"></td>
                    <td th:text="${examen.matiere.nomMatiere}"></td>
                    <td th:text="${examen.dateExamen}"></td>
                    <td th:text="${examen.notes.size()}"></td>
                    <td>
                        <a th:href="@{/examens/{id}(id=${examen.idExamen})}" class="btn btn-sm btn-info">Détails</a>
                        <a th:href="@{/examens/{id}/corrections(id=${examen.idExamen})}" class="btn btn-sm btn-warning">Corrections</a>
                        <a th:href="@{/examens/{id}/note-finale(id=${examen.idExamen})}" class="btn btn-sm btn-success">Note finale</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
