<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Corrections de l'examen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Correction Examens</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Corrections de l'examen</h2>
        <div th:if="${stats != null}">
            <p>Étudiant: <span th:text="${stats.etudiantNom + ' ' + stats.etudiantPrenom}"></span></p>
            <p>Matière: <span th:text="${stats.matiereNom}"></span></p>
            <p>Notes: <span th:text="${stats.notes}"></span></p>
            <p>Écart: <span th:text="${stats.ecartNotes}"></span></p>
        </div>
        <a th:href="@{/examens/{id}(id=${stats.idExamen})}" class="btn btn-secondary">Retour</a>
    </div>
</body>
</html>
