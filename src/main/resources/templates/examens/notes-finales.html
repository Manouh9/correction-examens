<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes finales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Correction Examens</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/examens">Examens</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/examens/notes-finales">Notes finales</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Notes finales calculées</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Étudiant</th>
                    <th>Matière</th>
                    <th>Note min</th>
                    <th>Note max</th>
                    <th>Note moyenne</th>
                    <th>Écart</th>
                    <th>Règle appliquée</th>
                    <th>Note finale</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="note : ${notesFinales}">
                    <td th:text="${note.etudiantNom + ' ' + note.etudiantPrenom}"></td>
                    <td th:text="${note.matiereNom}"></td>
                    <td th:text="${note.noteMin}"></td>
                    <td th:text="${note.noteMax}"></td>
                    <td th:text="${note.noteMoyenne}"></td>
                    <td th:text="${note.ecartNotes}"></td>
                    <td th:text="${note.resolutionAppliquee}"></td>
                    <td th:text="${note.noteFinale}" th:class="${note.noteFinale >= 10} ? 'text-success' : 'text-danger'"></td>
                    <td th:text="${note.statutConformite}" th:class="${note.statutConformite == 'Admis'} ? 'text-success' : 'text-danger'"></td>
                </tr>
            </tbody>
        </table>
        
        <a href="/" class="btn btn-secondary">Retour</a>
    </div>
</body>
</html>
