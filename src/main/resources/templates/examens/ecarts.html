<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Écarts de notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Correction Examens</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/examens">Examens</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/examens/ecarts">Écarts</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Écarts entre correcteurs</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Étudiant</th>
                    <th>Matière</th>
                    <th>Notes</th>
                    <th>Correcteurs</th>
                    <th>Note min</th>
                    <th>Note max</th>
                    <th>Note moyenne</th>
                    <th>Écart</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${ecarts}">
                    <td th:text="${stat.etudiantNom + ' ' + stat.etudiantPrenom}"></td>
                    <td th:text="${stat.matiereNom}"></td>
                    <td th:text="${stat.notes}"></td>
                    <td th:text="${stat.correcteurs}"></td>
                    <td th:text="${stat.noteMin}"></td>
                    <td th:text="${stat.noteMax}"></td>
                    <td th:text="${stat.noteMoyenne}"></td>
                    <td th:text="${stat.ecartNotes}" th:class="${stat.ecartNotes > 2} ? 'text-danger' : 'text-success'"></td>
                </tr>
            </tbody>
        </table>
        
        <a href="/" class="btn btn-secondary">Retour</a>
    </div>
</body>
</html>
