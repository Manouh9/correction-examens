# Configuration de la base de données
# Changez "examen_correction" en "correction_examen"
spring.datasource.url=jdbc:mysql://localhost:3306/correction_examen?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2762
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration du logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration du serveur
server.port=8080
server.servlet.context-path=/examen-correction